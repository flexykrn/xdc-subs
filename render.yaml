services:
  - type: web
    name: aa-subscription-manager
    env: node
    plan: free
    rootDir: subscription-manager/app
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20

      # Public runtime variables used by Next.js client/server routes
      - key: NEXT_PUBLIC_WEB3AUTH_CLIENT_ID
        sync: false
      - key: NEXT_PUBLIC_ARKA_API_KEY
        sync: false
      - key: NEXT_PUBLIC_BUNDLER_URL
        sync: false

      - key: NEXT_PUBLIC_APOTHEM_RPC_URL
        value: https://erpc.apothem.network
      - key: NEXT_PUBLIC_CHAIN_ID
        value: "51"
      - key: NEXT_PUBLIC_EXPLORER_URL
        value: https://explorer.apothem.network/

      - key: NEXT_PUBLIC_SUBSCRIPTION_MANAGER_ADDRESS
        sync: false

      # Token addresses used by services/subscribe flows
      - key: NEXT_PUBLIC_NETFLIX_TOKEN_ADDRESS
        sync: false
      - key: NEXT_PUBLIC_SPOTIFY_TOKEN_ADDRESS
        sync: false
      - key: NEXT_PUBLIC_YOUTUBE_TOKEN_ADDRESS
        sync: false
      - key: NEXT_PUBLIC_JIOHOTSTAR_TOKEN_ADDRESS
        sync: false
      - key: NEXT_PUBLIC_CLAUDE_TOKEN_ADDRESS
        sync: false
      - key: NEXT_PUBLIC_COPILOT_TOKEN_ADDRESS
        sync: false

      # Kept for compatibility with pages that still read Token A/B vars
      - key: NEXT_PUBLIC_TOKEN_A_ADDRESS
        sync: false
      - key: NEXT_PUBLIC_TOKEN_B_ADDRESS
        sync: false

      # Server-side secrets
      - key: FAUCET_PRIVATE_KEY
        sync: false
      - key: KEEPER_PRIVATE_KEY
        sync: false
