services:
  - type: web
    name: aa-subscription-manager
    env: node
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      # Node
      - key: NODE_ENV
        value: production

      # Web3Auth
      - key: NEXT_PUBLIC_WEB3AUTH_CLIENT_ID
        sync: false  # Set in Render dashboard

      # Etherspot / Arka
      - key: NEXT_PUBLIC_ARKA_API_KEY
        sync: false
      - key: NEXT_PUBLIC_BUNDLER_URL
        sync: false

      # XDC Network
      - key: NEXT_PUBLIC_APOTHEM_RPC_URL
        value: https://erpc.apothem.network
      - key: NEXT_PUBLIC_CHAIN_ID
        value: "51"
      - key: NEXT_PUBLIC_EXPLORER_URL
        value: https://explorer.apothem.network/

      # Contracts
      - key: NEXT_PUBLIC_SUBSCRIPTION_MANAGER_ADDRESS
        value: "0xe8271C9Bc2255A41cd2AB53FbfB69CE4B5f3032E"

      # Service Tokens
      - key: NEXT_PUBLIC_NETFLIX_TOKEN_ADDRESS
        value: "0x896F79883Bf0620Afcd3D8942f1Db8d3F447AE84"
      - key: NEXT_PUBLIC_SPOTIFY_TOKEN_ADDRESS
        value: "0x9F00925759A9F0FEb13373336B761A7267AE66a9"
      - key: NEXT_PUBLIC_YOUTUBE_TOKEN_ADDRESS
        value: "0x591CCebbd943a2F9a11F64eBf627d86600a0f38e"
      - key: NEXT_PUBLIC_JIOHOTSTAR_TOKEN_ADDRESS
        value: "0x87CB2de7edc1B9D725a5a6DeDdcbEF7e36fe3084"
      - key: NEXT_PUBLIC_CLAUDE_TOKEN_ADDRESS
        value: "0xA228078133e812677533166A44187c1Ae696687A"
      - key: NEXT_PUBLIC_COPILOT_TOKEN_ADDRESS
        value: "0x4c4456bF7A0e572D2C697626025DcB6d3D3Df7D1"

      # Server-side secrets (set in Render dashboard, NOT here)
      - key: FAUCET_PRIVATE_KEY
        sync: false
      - key: KEEPER_PRIVATE_KEY
        sync: false

    plan: free
